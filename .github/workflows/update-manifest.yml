
name: Update latest manifest

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: update-latest-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get release information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json body,publishedAt,url \
            > release.json

      - name: Normalize version and download installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="$GITHUB_REF_NAME"
          VERSION="${RELEASE_TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          INSTALLER="Laboratory_Setup_${VERSION}.exe"

          mkdir -p release

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$INSTALLER" \
            --dir release

          if [ ! -s "release/$INSTALLER" ]; then
            echo "Installer not found or empty: $INSTALLER"
            exit 1
          fi

          echo "Release tag: $RELEASE_TAG"
          echo "Application version: $VERSION"
          echo "Installer downloaded: $INSTALLER"

      - name: Calculate SHA-256
        id: hash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          INSTALLER="release/Laboratory_Setup_${VERSION}.exe"

          HASH=$(sha256sum "$INSTALLER" | awk '{print $1}')

          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "Installer SHA-256: $HASH"

      - name: Generate latest.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          version = release_tag.removeprefix("v")
          sha256 = os.environ["SHA256"]
          repository = os.environ["GITHUB_REPOSITORY"]

          if not re.fullmatch(r"\d+(\.\d+)*", version):
              raise ValueError(f"Invalid version: {version}")

          release = json.loads(
              Path("release.json").read_text(encoding="utf-8")
          )

          manifest = {
              "schema_version": 1,
              "version": version,
              "published_at": release.get("publishedAt"),
              "release_notes": release.get("body") or "",
              "release_url": release["url"],
              "installer_url": (
                  f"https://github.com/{repository}/releases/download/"
                  f"{release_tag}/Laboratory_Setup_{version}.exe"
              ),
              "sha256": sha256
          }

          Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Generated latest.json:")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit and push latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json

          if git diff --cached --quiet; then
            echo "latest.json has no changes"
            exit 0
          fi

          git commit -m "Update manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
